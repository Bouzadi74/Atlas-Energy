name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_DB: atlas
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ATLAS_DATABASE_URL: postgresql+psycopg://atlas:atlas@localhost:55432/atlas
      ATLAS_RUN_INTEGRATION_TESTS: "1"
      PGPASSWORD: atlas
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --extra dev --extra data --extra optimization --extra analytics
      - run: psql -h localhost -p 55432 -U atlas -d atlas -v ON_ERROR_STOP=1 -f infra/postgres/init/001_schemas.sql
      - run: psql -h localhost -p 55432 -U atlas -d atlas -v ON_ERROR_STOP=1 -f infra/postgres/migrations/002_scenario_execution.sql
      - run: psql -h localhost -p 55432 -U atlas -d atlas -v ON_ERROR_STOP=1 -f infra/postgres/migrations/003_optimization_results.sql
      - run: psql -h localhost -p 55432 -U atlas -d atlas -v ON_ERROR_STOP=1 -f infra/postgres/migrations/004_result_publication_lifecycle.sql
      - run: psql -h localhost -p 55432 -U atlas -d atlas -v ON_ERROR_STOP=1 -f infra/postgres/migrations/005_result_annualization.sql
      - run: psql -h localhost -p 55432 -U atlas -d atlas -v ON_ERROR_STOP=1 -f infra/postgres/migrations/006_scenario_worker_execution.sql
      - run: psql -h localhost -p 55432 -U atlas -d atlas -v ON_ERROR_STOP=1 -f infra/postgres/migrations/007_job_lifecycle.sql
      - run: uv run ruff check .
      - run: uv run pytest -p no:cacheprovider
      - run: uv run atlas-optimize --mode toy
      - run: cp dbt_atlas/profiles.example.yml dbt_atlas/profiles.yml
      - name: Publish CI toy optimizer result
        run: |
          RUN_PATH="$(dirname "$(find data/optimization/scenario_id=toy -name manifest.json -print -quit)")"
          uv run atlas-publish-results --run-path "$RUN_PATH"
      - run: uv run dbt build --project-dir dbt_atlas --profiles-dir dbt_atlas
